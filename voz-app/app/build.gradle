plugins {
    id "com.android.application"
}

android {
    namespace "pe.boxdelivery.voz"
    compileSdk 35

    defaultConfig {
        applicationId "pe.boxdelivery.voz"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Se firma con la llave de depuración: la app se instala a mano
            // (no va a Play Store).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
